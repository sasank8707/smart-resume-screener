services:
  - type: web
    name: smart-resume-screener-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LLM_PROVIDER
        sync: false          # set in the Render dashboard: mock | openai | anthropic
      - key: OPENAI_API_KEY
        sync: false          # secret — set in dashboard only
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: ANTHROPIC_API_KEY
        sync: false          # secret — set in dashboard only
      - key: SHORTLIST_THRESHOLD
        value: "7"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: CORS_ORIGINS
        sync: false          # e.g. https://smart-resume-screener.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: smart-resume-screener-db
          property: connectionString

databases:
  - name: smart-resume-screener-db
    plan: free
    databaseName: smart_resume_screener
    user: srs_app
